<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>AdminLTE 2 | Pedidos</title>

  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">

  <!-- CSS -->
  <link rel="stylesheet" href="./Admin/bower_components/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./Admin/bower_components/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="./Admin/bower_components/Ionicons/css/ionicons.min.css">
  <link rel="stylesheet" href="./Admin/dist/css/AdminLTE.min.css">
  <link rel="stylesheet" href="./Admin/dist/css/skins/skin-blue.min.css">
  <link rel="stylesheet" href="./css/admin-theme.css">

  <link rel="stylesheet"
  href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700">

</head>

<body class="hold-transition skin-green sidebar-mini">

<div id="header-container"></div>
<div id="sidebar-container"></div>

<div class="content-wrapper">
  <section class="content-header">
    <h1>
      Gestión de Pedidos
      <small>Administrar pedidos del sistema</small>
    </h1>
  </section>

  <section class="content container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="box">
          <div class="box-header with-border">
            <h3 class="box-title">
              Lista de Pedidos
            </h3>

            <div class="box-tools pull-right">

              <button
                class="btn btn-primary btn-sm"
                onclick="agregarPedido()">

                <i class="fa fa-plus"></i>
                Agregar Pedido
              </button>

            </div>

          </div>

          <div class="box-body">
            <table class="table table-bordered table-striped">
              <thead>

                <tr>
                  <th>ID</th>
                  <th>Usuario ID</th>
                  <th>Total</th>
                  <th>Estado</th>
                  <th>Dirección de Entrega</th>
                  <th>Fecha</th>
                  <th>Acciones</th>
                </tr>
              </thead>

              <tbody id="tabla-pedidos">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>

<div id="footer-container"></div>
<div id="scripts-container"></div>

<script src="./js/api.js"></script>
<script>
function loadComponent(url, containerId) {
  return fetch(url)
    .then(response => {

      if (!response.ok) {
        throw new Error('Error loading ' + url);
      }
      return response.text();
    })
    .then(data => {
      const container = document.getElementById(containerId);
      if (container) {
        container.innerHTML = data;
      }
    })
    .catch(error => {
      console.error(error);
    });
}

// COLOR POR ESTADO
function labelEstado(estado) {
  const colores = {
    'pendiente':  'label-warning',
    'confirmado': 'label-primary',
    'en_camino':  'label-info',
    'entregado':  'label-success',
    'cancelado':  'label-danger'
  };
  const clase = colores[estado] || 'label-default';
  return `<span class="label ${clase}">${estado}</span>`;
}

// CARGAR PEDIDOS
function cargarPedidos() {

  fetch(GastroAPI.url('/pedidos'))
    .then(res => res.json())
    .then(result => {
      const tabla = document.getElementById('tabla-pedidos');
      if(result.success){
        tabla.innerHTML = result.data.map(p => `
          <tr>
            <td>${p.id}</td>
            <td>${p.usuario_id}</td>
            <td>Q ${parseFloat(p.total).toFixed(2)}</td>
            <td>
              ${labelEstado(p.estado)}
            </td>
            <td>${p.direccion_entrega}</td>
            <td>${new Date(p.fecha).toLocaleDateString('es-GT')}</td>
            <td>
              <button
                class="btn btn-info btn-xs"
                onclick="editarPedido(${p.id})">
                <i class="fa fa-edit"></i>
                Editar
              </button>

              <button
                class="btn btn-danger btn-xs"
                onclick="eliminarPedido(${p.id})">

                <i class="fa fa-trash"></i>
                Eliminar
              </button>
            </td>
          </tr>
        `).join('');
      }

    })

    .catch(err => console.error(err));

}

// AGREGAR
function agregarPedido() {
  const usuario_id        = prompt("Usuario ID:");
  const total             = prompt("Total:");
  const estado            = prompt("Estado (pendiente / confirmado / en_camino / entregado / cancelado):");
  const direccion_entrega = prompt("Dirección de entrega:");

  if(!usuario_id || !total || !estado || !direccion_entrega){
    alert("Completa todos los campos");
    return;
  }

  fetch(GastroAPI.url('/pedidos'), {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },

    body: JSON.stringify({
      usuario_id,
      total,
      estado,
      direccion_entrega
    })
  })

  .then(res => res.json())
  .then(result => {

    if(result.success){
      alert("Pedido agregado");
      cargarPedidos();
    }else{
      alert("Error agregando pedido");
    }

  })
  .catch(err => console.error(err));
}

// EDITAR
function editarPedido(id) {

  fetch(GastroAPI.url(`/pedidos/${id}`))

    .then(res => res.json())
    .then(result => {
      if(result.success){
        const p = result.data;
        const nuevoUsuarioId  = prompt("Editar usuario ID:", p.usuario_id);
        const nuevoTotal      = prompt("Editar total:", p.total);
        const nuevoEstado     = prompt("Editar estado (pendiente / confirmado / en_camino / entregado / cancelado):", p.estado);
        const nuevaDireccion  = prompt("Editar dirección de entrega:", p.direccion_entrega);

        if(!nuevoUsuarioId || !nuevoTotal || !nuevoEstado || !nuevaDireccion){
          return;
        }
        fetch(GastroAPI.url(`/pedidos/${id}`), {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify({
            usuario_id:        nuevoUsuarioId,
            total:             nuevoTotal,
            estado:            nuevoEstado,
            direccion_entrega: nuevaDireccion
          })
        })
        .then(res => res.json())

        .then(data => {
          if(data.success){
            alert("Pedido actualizado");
            cargarPedidos();
          }else{
            alert("Error actualizando pedido");
          }
        });
      }
    })

    .catch(err => console.error(err));

}

// ELIMINAR
function eliminarPedido(id) {

  if(confirm('¿Eliminar pedido?')){

    fetch(GastroAPI.url(`/pedidos/${id}`), {
      method: 'DELETE'
    })

    .then(res => res.json())
    .then(result => {
      if(result.success){
        alert('Pedido eliminado');
        cargarPedidos();
      }else{
        alert('Error eliminando pedido');
      }
    })
    .catch(err => console.error(err));
  }
}

// INICIO
document.addEventListener('DOMContentLoaded', function() {

  Promise.all([
    loadComponent('./components/header.html', 'header-container'),
    loadComponent('./components/sidebar.html', 'sidebar-container'),
    loadComponent('./components/footer.html', 'footer-container'),
    loadComponent('./components/scripts.html', 'scripts-container')
  ])
  .then(() => {
    cargarPedidos();
  })
  .catch(error => {
    console.error(error);
  });
});
</script>
</body>
</html>
