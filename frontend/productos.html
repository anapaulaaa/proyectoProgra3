<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>AdminLTE 2 | Productos</title>

  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">

  <!-- CSS -->
  <link rel="stylesheet" href="./Admin/bower_components/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./Admin/bower_components/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="./Admin/bower_components/Ionicons/css/ionicons.min.css">
  <link rel="stylesheet" href="./Admin/dist/css/AdminLTE.min.css">
  <link rel="stylesheet" href="./Admin/dist/css/skins/skin-blue.min.css">
  <link rel="stylesheet" href="./css/admin-theme.css">

  <link rel="stylesheet"
  href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700">

</head>

<body class="hold-transition skin-green sidebar-mini">

<div id="header-container"></div>
<div id="sidebar-container"></div>

<div class="content-wrapper">
  <section class="content-header">
    <h1>
      Gestión de Productos
      <small>Administrar productos del sistema</small>
    </h1>
  </section>

  <section class="content container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="box">
          <div class="box-header with-border">
            <h3 class="box-title">
              Lista de Productos
            </h3>

            <div class="box-tools pull-right">

              <button
                class="btn btn-primary btn-sm"
                onclick="agregarProducto()">

                <i class="fa fa-plus"></i>
                Agregar Producto
              </button>

            </div>

          </div>

          <div class="box-body">
            <table class="table table-bordered table-striped">
              <thead>

                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Categoría ID</th>
                  <th>Descripción</th>
                  <th>Precio</th>
                  <th>Imagen</th>
                  <th>Disponible</th>
                  <th>Acciones</th>
                </tr>
              </thead>

              <tbody id="tabla-productos">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>

<div id="footer-container"></div>
<div id="scripts-container"></div>

<script src="./js/api.js"></script>
<script>
function loadComponent(url, containerId) {
  return fetch(url)
    .then(response => {

      if (!response.ok) {
        throw new Error('Error loading ' + url);
      }
      return response.text();
    })
    .then(data => {
      const container = document.getElementById(containerId);
      if (container) {
        container.innerHTML = data;
      }
    })
    .catch(error => {
      console.error(error);
    });
}

// CARGAR PRODUCTOS
function cargarProductos() {

  fetch(GastroAPI.url('/productos'))
    .then(res => res.json())
    .then(result => {
      const tabla = document.getElementById('tabla-productos');
      if(result.success){
        tabla.innerHTML = result.data.map(p => `
          <tr>
            <td>${p.id}</td>
            <td>${p.nombre}</td>
            <td>${p.categoria_id}</td>
            <td>${p.descripcion}</td>
            <td>Q ${parseFloat(p.precio).toFixed(2)}</td>
            <td>
              ${p.imagen
                ? `<img src="${p.imagen}" alt="${p.nombre}" style="height:40px; border-radius:4px;">`
                : '<span class="label label-default">Sin imagen</span>'}
            </td>
            <td>
              <span class="label ${p.disponible ? 'label-success' : 'label-danger'}">
                ${p.disponible ? 'Sí' : 'No'}
              </span>
            </td>
            <td>
              <button
                class="btn btn-info btn-xs"
                onclick="editarProducto(${p.id})">
                <i class="fa fa-edit"></i>
                Editar
              </button>

              <button
                class="btn btn-danger btn-xs"
                onclick="eliminarProducto(${p.id})">

                <i class="fa fa-trash"></i>
                Eliminar
              </button>
            </td>
          </tr>
        `).join('');
      }

    })

    .catch(err => console.error(err));

}

// AGREGAR
function agregarProducto() {
  const nombre       = prompt("Nombre:");
  const categoria_id = prompt("Categoría ID:");
  const descripcion  = prompt("Descripción:");
  const precio       = prompt("Precio:");
  const imagen       = prompt("URL de imagen (dejar vacío si no hay):");
  const disponible   = confirm("¿Disponible?") ? 1 : 0;

  if(!nombre || !categoria_id || !descripcion || !precio){
    alert("Completa todos los campos obligatorios");
    return;
  }

  fetch(GastroAPI.url('/productos'), {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },

    body: JSON.stringify({
      nombre,
      categoria_id,
      descripcion,
      precio,
      imagen,
      disponible
    })
  })

  .then(res => res.json())
  .then(result => {

    if(result.success){
      alert("Producto agregado");
      cargarProductos();
    }else{
      alert("Error agregando producto");
    }

  })
  .catch(err => console.error(err));
}

// EDITAR
function editarProducto(id) {

  fetch(GastroAPI.url(`/productos/${id}`))

    .then(res => res.json())
    .then(result => {
      if(result.success){
        const p = result.data;
        const nuevoNombre      = prompt("Editar nombre:", p.nombre);
        const nuevaCategoria   = prompt("Editar categoría ID:", p.categoria_id);
        const nuevaDescripcion = prompt("Editar descripción:", p.descripcion);
        const nuevoPrecio      = prompt("Editar precio:", p.precio);
        const nuevaImagen      = prompt("Editar URL de imagen:", p.imagen);
        const nuevoDisponible  = confirm("¿Disponible?") ? 1 : 0;

        if(!nuevoNombre || !nuevaCategoria || !nuevaDescripcion || !nuevoPrecio){
          return;
        }
        fetch(GastroAPI.url(`/productos/${id}`), {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify({
            nombre:       nuevoNombre,
            categoria_id: nuevaCategoria,
            descripcion:  nuevaDescripcion,
            precio:       nuevoPrecio,
            imagen:       nuevaImagen,
            disponible:   nuevoDisponible
          })
        })
        .then(res => res.json())

        .then(data => {
          if(data.success){
            alert("Producto actualizado");
            cargarProductos();
          }else{
            alert("Error actualizando producto");
          }
        });
      }
    })

    .catch(err => console.error(err));

}

// ELIMINAR
function eliminarProducto(id) {

  if(confirm('¿Eliminar producto?')){

    fetch(GastroAPI.url(`/productos/${id}`), {
      method: 'DELETE'
    })

    .then(res => res.json())
    .then(result => {
      if(result.success){
        alert('Producto eliminado');
        cargarProductos();
      }else{
        alert('Error eliminando producto');
      }
    })
    .catch(err => console.error(err));
  }
}

// INICIO
document.addEventListener('DOMContentLoaded', function() {

  Promise.all([
    loadComponent('./components/header.html', 'header-container'),
    loadComponent('./components/sidebar.html', 'sidebar-container'),
    loadComponent('./components/footer.html', 'footer-container'),
    loadComponent('./components/scripts.html', 'scripts-container')
  ])
  .then(() => {
    cargarProductos();
  })
  .catch(error => {
    console.error(error);
  });
});
</script>
</body>
</html>
