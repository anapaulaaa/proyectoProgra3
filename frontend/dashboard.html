<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>AdminLTE 2 | Dashboard</title>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">

  <!-- CSS -->
  <link rel="stylesheet" href="./Admin/bower_components/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./Admin/bower_components/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="./Admin/bower_components/Ionicons/css/ionicons.min.css">
  <link rel="stylesheet" href="./Admin/dist/css/AdminLTE.min.css">
  <link rel="stylesheet" href="./Admin/dist/css/skins/skin-blue.min.css">
  <link rel="stylesheet" href="./css/admin-theme.css">

  <link rel="stylesheet"
  href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic">
</head>

<body class="hold-transition skin-green sidebar-mini">

<div id="header-container"></div>
<div id="sidebar-container"></div>

<div class="content-wrapper">
  <section class="content-header">
    <h1>
      Panel Principal
      <small>Dashboard de GastroPrueba</small>
    </h1>
    <ol class="breadcrumb">
      <li><a href="dashboard.html"><i class="fa fa-dashboard"></i> Inicio</a></li>
      <li class="active">Dashboard</li>
    </ol>
  </section>

  <section class="content container-fluid">

    <!-- TARJETAS DE RESUMEN -->
    <div class="row">

      <!-- Usuarios -->
      <div class="col-lg-4 col-xs-6">
        <div class="small-box bg-aqua">
          <div class="inner">
            <h3 id="total-usuarios">...</h3>
            <p>Usuarios registrados</p>
          </div>
          <div class="icon">
            <i class="fa fa-users"></i>
          </div>
          <a href="usuarios.html" class="small-box-footer">
            Ver todos <i class="fa fa-arrow-circle-right"></i>
          </a>
        </div>
      </div>

      <!-- Productos -->
      <div class="col-lg-4 col-xs-6">
        <div class="small-box bg-green">
          <div class="inner">
            <h3 id="total-productos">...</h3>
            <p>Productos disponibles</p>
          </div>
          <div class="icon">
            <i class="fa fa-cutlery"></i>
          </div>
          <a href="productos.html" class="small-box-footer">
            Ver todos <i class="fa fa-arrow-circle-right"></i>
          </a>
        </div>
      </div>

      <!-- Pedidos -->
      <div class="col-lg-4 col-xs-6">
        <div class="small-box bg-yellow">
          <div class="inner">
            <h3 id="total-pedidos">...</h3>
            <p>Pedidos en total</p>
          </div>
          <div class="icon">
            <i class="fa fa-shopping-cart"></i>
          </div>
          <a href="pedidos.html" class="small-box-footer">
            Ver todos <i class="fa fa-arrow-circle-right"></i>
          </a>
        </div>
      </div>

    </div>

    <!-- PEDIDOS RECIENTES -->
    <div class="row">
      <div class="col-md-12">
        <div class="box">
          <div class="box-header with-border">
            <h3 class="box-title">Pedidos recientes</h3>
            <div class="box-tools pull-right">
              <a href="pedidos.html" class="btn btn-primary btn-sm">
                <i class="fa fa-list"></i> Ver todos
              </a>
            </div>
          </div>
          <div class="box-body">
            <table class="table table-bordered table-striped">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Usuario</th>
                  <th>Total</th>
                  <th>Estado</th>
                  <th>Dirección</th>
                  <th>Fecha</th>
                </tr>
              </thead>
              <tbody id="tabla-pedidos-recientes">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </section>
</div>

<div id="footer-container"></div>
<div id="scripts-container"></div>

<script src="./js/api.js"></script>
<script>
function loadComponent(url, containerId) {
  return fetch(url)
    .then(response => {
      if (!response.ok) {
        throw new Error('Error loading ' + url);
      }
      return response.text();
    })
    .then(data => {
      const container = document.getElementById(containerId);
      if (container) {
        container.innerHTML = data;
      }
    })
    .catch(error => {
      console.error('Error:', error);
      const container = document.getElementById(containerId);
      if (container) {
        container.innerHTML = '<p style="color:red">Error cargando ' + url + '</p>';
      }
    });
}

// COLOR POR ESTADO
function labelEstado(estado) {
  const colores = {
    'pendiente':  'label-warning',
    'confirmado': 'label-primary',
    'en_camino':  'label-info',
    'entregado':  'label-success',
    'cancelado':  'label-danger'
  };
  const clase = colores[estado] || 'label-default';
  return `<span class="label ${clase}">${estado}</span>`;
}

// CARGAR DATOS DEL DASHBOARD
function cargarDashboard() {

  const usuariosPromise = fetch(GastroAPI.url('/user')).then(res => res.json());
  const productosPromise = fetch(GastroAPI.url('/productos')).then(res => res.json());
  const pedidosPromise = fetch(GastroAPI.url('/pedidos')).then(res => res.json());

  Promise.all([
    usuariosPromise,
    productosPromise,
    pedidosPromise
  ])
    .then(([usuariosResult, productosResult, pedidosResult]) => {
      if (!pedidosResult.success || !usuariosResult.success || !productosResult.success) return;

      document.getElementById('total-usuarios').textContent = usuariosResult.data.length;
      const disponibles = productosResult.data.filter(producto => producto.disponible);
      document.getElementById('total-productos').textContent = disponibles.length;

      document.getElementById('total-pedidos').textContent = pedidosResult.data.length;

      const usuariosPorId = new Map(usuariosResult.data.map(usuario => [Number(usuario.id), usuario.nombre]));

      const recientes = [...pedidosResult.data]
        .sort((a, b) => (new Date(b.fecha || 0)) - (new Date(a.fecha || 0)))
        .slice(0, 5);

      const tabla = document.getElementById('tabla-pedidos-recientes');
      tabla.innerHTML = recientes.map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${p.usuario_nombre || usuariosPorId.get(Number(p.usuario_id)) || 'Invitado'}</td>
          <td>Q ${parseFloat(p.total).toFixed(2)}</td>
          <td>${labelEstado(p.estado)}</td>
          <td>${p.direccion_entrega}</td>
          <td>${new Date(p.fecha).toLocaleDateString('es-GT')}</td>
        </tr>
      `).join('');
    })
    .catch(err => console.error(err));
}

// INICIO
document.addEventListener('DOMContentLoaded', function() {
  Promise.all([
    loadComponent('./components/header.html', 'header-container'),
    loadComponent('./components/sidebar.html', 'sidebar-container'),
    loadComponent('./components/footer.html', 'footer-container'),
    loadComponent('./components/scripts.html', 'scripts-container')
  ])
  .then(() => {
    cargarDashboard();
  })
  .catch(error => {
    console.error('Error cargando componentes:', error);
  });
});
</script>

</body>
</html>
